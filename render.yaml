services:
  - type: worker
    name: clipgenius-worker
    runtime: docker
    repo: https://github.com/hggffifgyfddf-cmyk/clipgenius-worker
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_TRAINING
        value: true
      - key: MAX_CONCURRENT_JOBS
        value: 10